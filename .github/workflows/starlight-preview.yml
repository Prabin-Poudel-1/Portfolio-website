name: Validate Starlight Preview
on:
  push:
    branches:
      - feat/ivory-graphite-luminous-streamlines
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-hero.mjs
      - run: git diff --check
