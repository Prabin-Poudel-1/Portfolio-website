<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">GhostCursor — private browser collaboration</title>
<desc id="description">Designed project illustration, not a live screenshot. Two matching dark browser views share a lavender sticky note and a remote pointer, connected by encrypted WebRTC.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11101d"/><stop offset="1" stop-color="#17152c"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1" y1="0" y2=".2"><stop stop-color="#eee9ff"/><stop offset=".65" stop-color="#b89bff"/><stop offset="1" stop-color="#8368e9"/></linearGradient>
  <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebd6ff"/><stop offset="1" stop-color="#bfa3ff"/></linearGradient>
  <filter id="shadow" x="-30%" y="-35%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#05030d" flood-opacity=".7"/></filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <pattern id="mesh" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b6a1fe" stroke-opacity=".055"/></pattern>
</defs>
